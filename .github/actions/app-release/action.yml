# Builds an app's image, packs its deploy/ (edge-pack), signs it keyless on
# public Sigstore, pushes it as an OCI artifact and, on a v* tag, attaches it
# to the release. A composite action, so the certificate names the caller's
# workflow. The calling job needs:
#
#   permissions: { contents: write, packages: write, id-token: write }
#
#   - uses: actions/checkout@v7
#   - uses: platform-meridian/edge/.github/actions/app-release@<ref>
#     with: { name: app-web, image-key: WEB_IMAGE }
name: Release an app
description: Build, pack, sign keyless and publish an app a unit installs.
inputs:
  name:
    description: The image's name in the owner's ghcr namespace.
    required: true
  image-key:
    description: The module.toml [images] key the built image pins.
    required: true
  deploy:
    description: The app's deploy/ directory.
    default: deploy
  context:
    description: The image's build context.
    default: .
  containerfile:
    description: The image's Containerfile, in the context.
    default: Containerfile
  secret-owner:
    description: <namespace>/<serviceaccount> that generates declared secrets.
    default: ""
  secret-label:
    description: <key>=<value> the secret owner selects declarations by.
    default: ""
outputs:
  artifact:
    description: The app's OCI artifact, by tag.
    value: ${{ steps.publish.outputs.artifact }}
runs:
  using: composite
  steps:
    - id: names
      shell: bash
      run: |
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        image="ghcr.io/$owner/${{ inputs.name }}"
        case "$GITHUB_REF" in
          refs/tags/v*) version="$GITHUB_REF_NAME" ;;
          *) version="0.0.0-${GITHUB_SHA::12}" ;;
        esac
        {
          echo "image=$image"
          echo "version=$version"
          echo "epoch=$(git log -1 --format=%ct)"
        } >> "$GITHUB_OUTPUT"

    - id: build
      uses: redhat-actions/buildah-build@v3
      with:
        image: ${{ steps.names.outputs.image }}
        tags: ${{ steps.names.outputs.version }}
        context: ${{ inputs.context }}
        containerfiles: ${{ inputs.context }}/${{ inputs.containerfile }}
        oci: true
    - id: push
      uses: redhat-actions/push-to-registry@v3
      with:
        tags: ${{ steps.build.outputs.tags }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: The image as an OCI layout
      shell: bash
      run: |
        skopeo copy --all --preserve-digests \
          "docker://${{ steps.names.outputs.image }}@${{ steps.push.outputs.digest }}" \
          "oci:$RUNNER_TEMP/layout"

    - name: edge-pack, from this action's commit
      shell: bash
      run: |
        cargo install --locked --root "$RUNNER_TEMP/edge-pack" \
          --git "https://github.com/${{ github.action_repository }}" --rev "${{ github.action_ref }}" edge-pack
        echo "$RUNNER_TEMP/edge-pack/bin" >> "$GITHUB_PATH"

    - name: Pack
      shell: bash
      run: |
        edge-pack pack "${{ inputs.deploy }}" "$RUNNER_TEMP/staged" \
          --version "${{ steps.names.outputs.version }}" \
          --epoch "${{ steps.names.outputs.epoch }}" \
          --artifact "${{ steps.names.outputs.image }}/module" \
          --layout "$RUNNER_TEMP/layout" \
          --image "${{ inputs.image-key }}=${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}@${{ steps.push.outputs.digest }}" \
          ${{ inputs.secret-owner && format('--secret-owner {0} --secret-label {1}', inputs.secret-owner, inputs.secret-label) }}

    - uses: sigstore/cosign-installer@v3
    - name: Sign the sums keyless
      shell: bash
      run: |
        cosign sign-blob --yes --new-bundle-format \
          --bundle "$RUNNER_TEMP/SHA256SUMS.sigstore.json" "$RUNNER_TEMP/staged/SHA256SUMS"

    - name: Seal
      shell: bash
      run: |
        edge-pack seal "$RUNNER_TEMP/staged" "$RUNNER_TEMP/SHA256SUMS.sigstore.json" \
          "$RUNNER_TEMP/${{ inputs.name }}-${{ steps.names.outputs.version }}.tar"

    - uses: oras-project/setup-oras@v1
    - id: publish
      name: Push the app, and attach it to the release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        artifact="${{ steps.names.outputs.image }}/app:${{ steps.names.outputs.version }}"
        tar="${{ inputs.name }}-${{ steps.names.outputs.version }}.tar"
        echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
        (cd "$RUNNER_TEMP" && oras push "$artifact" \
          --artifact-type application/vnd.meridian.app.v1 \
          "$tar:application/vnd.meridian.bundle.v1.tar")
        echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$tar" --clobber
        fi
