# The flight recorder, as a Talos extension service: it acts before etcd and
# the kubelet. The consumer supplies @BUILD_EPOCH@, the clock's floor until the
# ring proves a later one.
name: edge-scope
depends:
  - path: /var/lib/containerd
restart: always
container:
  entrypoint: /edge-scope
  environment:
    - EDGE_SCOPE_BUILD_EPOCH=@BUILD_EPOCH@
    - EDGE_SCOPE_DEV=/host/dev
    - EDGE_SCOPE_CRI=/host/run/containerd/containerd.sock
    - EDGE_SCOPE_MACHINED=/host/system/run/machined/machine.sock
    - EDGE_SCOPE_RING=/host/var/mnt/edge-evidence/edge-scope/ring.bin
    - EDGE_WATCH_STATE=/host/var/mnt/edge-evidence/edge-watch
    - EDGE_EVIDENCE=/host/var/mnt/edge-evidence
  mounts:
    - source: /
      destination: /host
      type: bind
      options: [rbind, rslave, rw]
  # No capabilities to list: machined grants extension services all of them
  # (CAP_SYS_TIME for the clock, CAP_SYS_ADMIN for the SMART log).
  security:
    writeableRootfs: false
    writeableSysfs: false
