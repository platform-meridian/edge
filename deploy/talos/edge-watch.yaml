# The hardware watchdog, armed before the kubelet. Its checks are the files its
# ExtensionServiceConfig puts in /etc/edge-watch, one fragment each.
name: edge-watch
depends:
  - path: /var/mnt
  - configuration: true
restart: always
container:
  entrypoint: /edge-watch
  environment:
    - EDGE_WATCH_CONFIG=/etc/edge-watch
    - EDGE_WATCH_DEVICE=/host/dev/watchdog0
    - EDGE_WATCH_MACHINED=/host/system/run/machined/machine.sock
    - EDGE_WATCH_STATE=/host/var/mnt/edge-evidence/edge-watch
    - EDGE_EVIDENCE=/host/var/mnt/edge-evidence
  mounts:
    - source: /
      destination: /host
      type: bind
      options: [rbind, rslave, rw]
  security:
    writeableRootfs: false
    writeableSysfs: false
