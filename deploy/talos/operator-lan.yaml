# An extension service, so it is up whatever state Kubernetes is in. Its
# ExtensionServiceConfig supplies EDGE_DHCP_ADDR (address/prefix) and
# EDGE_DHCP_DOMAIN; machined grants the host network and binding :53 and :67.
name: operator-lan
depends:
  - configuration: true
restart: always
container:
  entrypoint: /edge-dhcp
  environment:
    - EDGE_DHCP_LEASES=/run/edge-dhcp/leases
  mounts:
    - source: /run/edge-dhcp
      destination: /run/edge-dhcp
      type: bind
      options: [rbind, rw]
  security:
    writeableRootfs: false
    writeableSysfs: false
