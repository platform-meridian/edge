# The image registry containerd and Flux pull through, up before the kubelet.
# What its store lacks it passes through, read-only, to Talos's registryd and
# the image cache baked into the media. It writes the store only to remove
# content that fails its digest; the updater imports into it and sweeps it.
name: edge-registry
depends:
  - path: /var/mnt/edge-registry
restart: always
container:
  entrypoint: /edge-registry
  environment:
    - EDGE_REGISTRY_ROOT=/var/mnt/edge-registry
    - EDGE_REGISTRY_LISTEN=127.0.0.1:5000
    - EDGE_REGISTRY_UPSTREAM=127.0.0.1:3172
  mounts:
    # rslave: the edge-registry volume may be mounted after this starts.
    - source: /var/mnt
      destination: /var/mnt
      type: bind
      options: [rbind, rslave, rw]
  security:
    writeableRootfs: false
    writeableSysfs: false
