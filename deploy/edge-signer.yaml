# Signs pod certificates for edge.meridian/node from the CA in Secret
# edge-signer-ca (kubernetes.io/tls: tls.key, and tls.crt from the issuing CA up
# to the root), creating the unit's own when there is none, and approves the
# kubelets' serving certificates. On loopback it issues operators short-lived
# access: Talos's os:admin, and Kubernetes as group edge:administrators.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-signer
  namespace: edge
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: edge-signer
  namespace: edge
spec:
  roles: ["os:admin"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edge-signer
rules:
  - apiGroups: ["certificates.k8s.io"]
    resources: ["podcertificaterequests"]
    verbs: ["list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["podcertificaterequests/status"]
    verbs: ["patch"]
  # sign: answering a request for this signer. attest: publishing its bundle.
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames: ["edge.meridian/node"]
    verbs: ["sign", "attest"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["clustertrustbundles"]
    verbs: ["create", "patch"]
  # A pod whose certificate starts in the future is recreated.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # Approving kubelet serving certificates whose names are the Node's own.
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/approval"]
    verbs: ["patch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames: ["kubernetes.io/kubelet-serving"]
    verbs: ["approve"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  # Access: a caller's token reviewed, its permission checked, and its client
  # certificate requested, approved and read.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["create", "get"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames: ["kubernetes.io/kube-apiserver-client"]
    verbs: ["approve"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: edge-signer
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edge-signer }
subjects:
  - { kind: ServiceAccount, name: edge-signer, namespace: edge }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: edge-administrators
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: "edge:administrators" }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edge-signer
  namespace: edge
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["edge-signer-ca"]
    verbs: ["get", "list", "watch"]
  # Create cannot be limited by name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edge-signer
  namespace: edge
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: edge-signer }
subjects:
  - { kind: ServiceAccount, name: edge-signer, namespace: edge }
---
# platform-core's leaf, Secret meridian/meridian-tls, which its portable
# rendering reads as cert-manager would write it: kept by the signer
# (EDGE_SIGNER_LEAF), its key made beside each issue.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edge-signer-leaf
  namespace: meridian
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["meridian-tls"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edge-signer-leaf
  namespace: meridian
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: edge-signer-leaf }
subjects:
  - { kind: ServiceAccount, name: edge-signer, namespace: edge }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-signer
  namespace: edge
  labels: { app: edge-signer }
spec:
  selector:
    matchLabels: { app: edge-signer }
  template:
    metadata:
      labels: { app: edge-signer }
    spec:
      # The door's certificate must not wait on the pod network.
      hostNetwork: true
      serviceAccountName: edge-signer
      tolerations:
        - operator: Exists
      containers:
        - name: edge-signer
          image: "ghcr.io/platform-meridian/edge-signer"
          env:
            - { name: EDGE_SIGNER_DOMAIN, value: "@OPERATOR_DOMAIN@" }
            - { name: EDGE_SIGNER_ADDRESS, value: "@OPERATOR_ADDR@" }
            - { name: EDGE_SIGNER_APISERVER_PORT, value: "@APISERVER_PORT@" }
            # One leaf serves core's HTTPS and its WebTransport pin, which
            # browsers refuse over two weeks' validity (P-256 only): 10 days
            # leaves margin for RTC skew.
            - { name: EDGE_SIGNER_LEAF, value: meridian/meridian-tls }
            - { name: EDGE_SIGNER_LEAF_DNS, value: "@OPERATOR_DOMAIN@,localhost" }
            - { name: EDGE_SIGNER_LEAF_IPS, value: "node,127.0.0.1,::1" }
            - { name: EDGE_SIGNER_LEAF_LIFETIME, value: "864000" }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports:
            - { name: healthz, containerPort: 9750, protocol: TCP }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: talos, mountPath: /var/run/secrets/talos.dev, readOnly: true }
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: talos
          secret: { secretName: edge-signer, optional: true }
