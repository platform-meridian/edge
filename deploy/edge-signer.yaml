# Signs pod certificates for edge.meridian/node from the CA in Secret
# edge-signer-ca (kubernetes.io/tls: tls.key, and tls.crt from the issuing CA up
# to the root), and approves the kubelets' serving certificates.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-signer
  namespace: edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edge-signer
rules:
  - apiGroups: ["certificates.k8s.io"]
    resources: ["podcertificaterequests"]
    verbs: ["list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["podcertificaterequests/status"]
    verbs: ["patch"]
  # sign: answering a request for this signer. attest: publishing its bundle.
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames: ["edge.meridian/node"]
    verbs: ["sign", "attest"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["clustertrustbundles"]
    verbs: ["create", "patch"]
  # A pod whose certificate starts in the future is recreated.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # Approving kubelet serving certificates whose names are the Node's own.
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/approval"]
    verbs: ["patch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames: ["kubernetes.io/kubelet-serving"]
    verbs: ["approve"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: edge-signer
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edge-signer }
subjects:
  - { kind: ServiceAccount, name: edge-signer, namespace: edge }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edge-signer
  namespace: edge
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["edge-signer-ca"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edge-signer
  namespace: edge
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: edge-signer }
subjects:
  - { kind: ServiceAccount, name: edge-signer, namespace: edge }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-signer
  namespace: edge
  labels: { app: edge-signer }
spec:
  selector:
    matchLabels: { app: edge-signer }
  template:
    metadata:
      labels: { app: edge-signer }
    spec:
      # The door's certificate must not wait on the pod network.
      hostNetwork: true
      serviceAccountName: edge-signer
      tolerations:
        - operator: Exists
      containers:
        - name: edge-signer
          image: "ghcr.io/platform-meridian/edge-signer"
          env:
            - { name: EDGE_SIGNER_DOMAIN, value: "@OPERATOR_DOMAIN@" }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports:
            - { name: healthz, containerPort: 9750, protocol: TCP }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
            periodSeconds: 10
            failureThreshold: 3
