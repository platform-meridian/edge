# The node stays NotReady until this pod writes the conflist, so a consumer may
# also apply this file alone at bootstrap.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-cni
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edge-cni
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # NetworkPolicy: without these nothing is enforced.
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  # The node's pod CIDR.
  - apiGroups: [""]
    resources: ["nodes"]
    resourceNames: ["@NODE_HOSTNAME@"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: edge-cni
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edge-cni }
subjects:
  - { kind: ServiceAccount, name: edge-cni, namespace: kube-system }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-cni
  namespace: kube-system
  labels:
    k8s-app: edge-cni
spec:
  selector: { matchLabels: { k8s-app: edge-cni } }
  template:
    metadata:
      labels: { k8s-app: edge-cni }
    spec:
      serviceAccountName: edge-cni
      hostNetwork: true
      dnsPolicy: Default
      priorityClassName: system-node-critical
      # It must land on a node no CNI has made Ready yet.
      tolerations:
        - operator: Exists
      containers:
        - name: edge-cni
          image: "edge-cni:appliance"
          env:
            # The apiserver's ClusterIP is circular here: this daemon is what
            # makes ClusterIPs resolve.
            - { name: KUBERNETES_SERVICE_HOST, value: "@APISERVER_HOST@" }
            - { name: KUBERNETES_SERVICE_PORT, value: "@APISERVER_PORT@" }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # BPF loads, pins and attaches; NET_ADMIN is what cgroup and tc
            # programs, tcx links and nf_tables need on top.
            capabilities: { add: [BPF, NET_ADMIN], drop: [ALL] }
            # containerd's default profile allows bpf() to a holder of CAP_BPF.
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: cni-bin, mountPath: /opt/cni/bin }
            - { name: cni-conf, mountPath: /etc/cni/net.d }
            # The host's cgroup root, so the attach covers every process on the node.
            - { name: cgroup, mountPath: /sys/fs/cgroup, readOnly: true }
            # The host's bpffs, so links and maps outlive the pod and a restart re-attaches
            # instead of blackholing every service. A hostPath bind needs no mountPropagation.
            - { name: bpffs, mountPath: /sys/fs/bpf }
      volumes:
        - { name: cni-bin, hostPath: { path: /opt/cni/bin, type: DirectoryOrCreate } }
        - { name: cni-conf, hostPath: { path: /etc/cni/net.d, type: DirectoryOrCreate } }
        - { name: cgroup, hostPath: { path: /sys/fs/cgroup } }
        - { name: bpffs, hostPath: { path: /sys/fs/bpf, type: Directory } }
