# Meridian Edge's workloads. The consumer supplies, before applying:
#   @OPERATOR_DOMAIN@, @OPERATOR_ADDR@  the domain and address the unit is reached by
#   @APISERVER_HOST@, @APISERVER_PORT@  the node's own apiserver
#   @CLUSTER_DNS@                       the kubelet's clusterDNS address
#   the Gateway API CRDs
# Images are the published ones; override these names to pin digests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - edge-cni.yaml
  - edge-dns.yaml
  - edge-idle.yaml
  - edge-signer.yaml
  - edge-gateway.yaml
  - edge-update.yaml

images:
  - { name: ghcr.io/platform-meridian/edge-cni, newTag: v0.3.0 }
  - { name: ghcr.io/platform-meridian/edge-dns, newTag: v0.3.0 }
  - { name: ghcr.io/platform-meridian/edge-gateway, newTag: v0.3.0 }
  - { name: ghcr.io/platform-meridian/edge-idle, newTag: v0.3.0 }
  - { name: ghcr.io/platform-meridian/edge-signer, newTag: v0.3.0 }
  - { name: ghcr.io/platform-meridian/edge-update, newTag: v0.3.0 }
