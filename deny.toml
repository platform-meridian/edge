[graph]
targets = ["x86_64-unknown-linux-musl", "x86_64-unknown-linux-gnu"]

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "0BSD", "CC0-1.0", "CDLA-Permissive-2.0"]
private = { ignore = true }
# The FIPS module (ADR-0024 §2) is AWS-LC's FIPS branch, whose older OpenSSL
# code keeps the OpenSSL licence; nothing else may bring it in.
exceptions = [{ crate = "aws-lc-fips-sys", allow = ["OpenSSL"] }]

[bans]
multiple-versions = "allow"
# aws-lc-rs is the one crypto provider (ADR-0024 §2): ring has no ML-KEM and
# no FIPS module.
deny = [{ crate = "ring", reason = "aws-lc-rs is the one crypto provider (ADR-0024 §2)" }]

[sources]
allow-git = ["https://github.com/aya-rs/aya"]

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 is compiled in only because connectrpc-health 0.9 turns on connectrpc's default features; nothing here asks for it. It never runs: edge-update's and edge-signer's Connect servers have no codec, so they neither offer nor accept compression, and edge calls no Connect service. Removed by connectrpc-health without connectrpc's default features (prepared upstream; connectrpc/connect-rust#338)." },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7, as RUSTSEC-2026-0391." },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7, as RUSTSEC-2026-0391." },
]
