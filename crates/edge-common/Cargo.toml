[package]
name = "edge-common"
version.workspace = true
description = "Meridian Edge: shared daemon runtime (shutdown, logging, durable writes, restart backoff, Landlock)"
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
landlock = "0.4.7"
nix = { workspace = true, features = ["signal"] }
tokio = { workspace = true, features = ["signal", "sync", "time"] }
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `tls`: Edge's one TLS policy.
rustls.workspace = true

[features]
# aws-lc-rs's FIPS 140-3 module rather than its default build; CMake and Go
# build it, and on musl the kernel headers (.cargo/config.toml).
default = ["fips"]
fips = ["rustls/fips"]

[dev-dependencies]
nix = { workspace = true, features = ["signal", "process", "socket", "net"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
tempfile = "3"
