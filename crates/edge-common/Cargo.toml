[package]
name = "edge-common"
version.workspace = true
description = "Meridian Edge: shared daemon runtime (shutdown, logging, durable writes, restart backoff, Landlock)"
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
landlock = "0.4.7"
nix = { workspace = true, features = ["signal"] }
tokio = { workspace = true, features = ["signal", "sync", "time"] }
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
nix = { workspace = true, features = ["signal", "process"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
tempfile = "3"
