[package]
name = "edge-update"
version.workspace = true
description = "Meridian Edge: verifies and applies signed update bundles on the unit"
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
edge-common = { path = "../edge-common" }
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tar.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs"] }
kube.workspace = true
k8s-openapi.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
tonic-prost.workspace = true
prost.workspace = true
connectrpc = { version = "0.9", default-features = false, features = ["server", "client", "gzip"] }
buffa = "0.9"
ssh-key = { version = "0.6", features = ["ed25519", "std"] }
sha2 = "0.10"
hex = "0.4"
rustls.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
base64 = "0.22"
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
hyper.workspace = true
tempfile = "3"
rcgen = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true
connectrpc-build = "0.9"
