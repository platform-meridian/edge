[package]
name = "edge-update"
version.workspace = true
description = "Meridian Edge: verifies and applies signed update bundles on the unit"
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
edge-common = { path = "../edge-common" }
edge-registry = { path = "../edge-registry" }
edge-bundle = { path = "../edge-bundle" }
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs"] }
kube.workspace = true
k8s-openapi.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
tonic-prost.workspace = true
prost.workspace = true
connectrpc = { version = "0.9", default-features = false, features = ["server", "client", "gzip"] }
connectrpc-health = { version = "0.9", default-features = false }
buffa = "0.9"
sha2 = "0.10"
hex = "0.4"
rustls.workspace = true
base64 = "0.22"
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
flate2.workspace = true
tar.workspace = true
connectrpc-health = "0.9"
edge-bundle = { path = "../edge-bundle", features = ["testkit"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
rcgen = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true
connectrpc-build = "0.9"
