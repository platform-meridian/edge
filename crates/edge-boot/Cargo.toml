[package]
name = "edge-boot"
version.workspace = true
description = "Meridian Edge: the unit signs its own boot chain with keys in its TPM"
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Keys in software and stand-in images, for tests.
testkit = ["dep:ring"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.3"
ring = { version = "0.17", optional = true }

[dev-dependencies]
edge-boot = { path = ".", features = ["testkit"] }
