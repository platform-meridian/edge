version: v1alpha1
debug: false
persist: true
machine:
  type: controlplane
  token: unit-mtoken.0123456789abcdef
  ca:
    crt: unit-os-ca-crt
    key: unit-os-ca-key
  certSANs:
    - unit-a
    - 10.20.0.2
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.35.2
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
    extraConfig:
      maxPods: 250
  network:
    interfaces:
      - deviceSelector:
          hardwareAddr: "unit-a-mac"
        dhcp: false
        addresses: [10.20.0.2/24]
  install:
    disk: /dev/nvme0n1
    image: registry.example/installer:t1
    wipe: false
  registries:
    mirrors:
      docker.io:
        endpoints: [http://127.0.0.1:5000]
  files:
    - content: unit-a-ssh-host-key
      permissions: 0o600
      path: /var/etc/unit.key
      op: create
  sysctls:
    vm.dirty_ratio: "10"
  features:
    rbac: true
    stableHostname: true
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
  nodeLabels:
    node.kubernetes.io/exclude-from-external-load-balancers: ""
cluster:
  id: unit-cluster-id
  secret: unit-cluster-secret
  controlPlane:
    endpoint: https://unit-a:6443
  clusterName: unit-a
  network:
    dnsDomain: cluster.local
    podSubnets: [10.244.0.0/16]
    serviceSubnets: [10.96.0.0/12]
    cni:
      name: none
  token: unit-btoken.0123456789abcdef
  secretboxEncryptionSecret: unit-secretbox
  ca:
    crt: unit-k8s-ca-crt
    key: unit-k8s-ca-key
  aggregatorCA:
    crt: unit-aggregator-crt
    key: unit-aggregator-key
  serviceAccount:
    key: unit-service-account-key
  apiServer:
    image: registry.k8s.io/kube-apiserver:v1.35.2
    certSANs: [unit-a, 10.20.0.2]
    disablePodSecurityPolicy: true
    admissionControl:
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1alpha1
          defaults:
            enforce: baseline
  controllerManager:
    image: registry.k8s.io/kube-controller-manager:v1.35.2
  proxy:
    disabled: true
  scheduler:
    image: registry.k8s.io/kube-scheduler:v1.35.2
  discovery:
    enabled: false
  etcd:
    ca:
      crt: unit-etcd-ca-crt
      key: unit-etcd-ca-key
    image: registry.example/store:t1
  inlineManifests:
    - name: operator
      contents: unit-a-seed
  allowSchedulingOnControlPlanes: true
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: unit-a
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: unit-a-resolver
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp1s0
up: true
addresses:
  - address: unit-a-link/24
---
apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  keys:
    - slot: 0
      tpm: {}
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 40GB
encryption:
  provider: luks2
  keys:
    - slot: 0
      static:
        passphrase: unit-ephemeral-key
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: data
provisioning:
  diskSelector:
    match: system_disk
  minSize: 10GB
filesystem:
  type: xfs
encryption:
  provider: luks2
  keys:
    - slot: 0
      static:
        passphrase: unit-recovery-key
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: signer/ca.pem
contents: unit-signing-ca-key
---
apiVersion: v1alpha1
kind: TrustedRootsConfig
name: operator
certificates: operator-root-crt
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: edge-watch
environment:
  - EDGE_WATCH_TIMEOUT=60
---
apiVersion: v1alpha1
kind: WatchdogTimerConfig
device: /dev/watchdog0
timeout: 5m0s
---
apiVersion: v1alpha1
kind: KmsgLogConfig
name: remote
url: tcp://127.0.0.1:5170
