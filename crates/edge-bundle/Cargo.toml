[package]
name = "edge-bundle"
version.workspace = true
description = "Meridian Edge: the update bundle and machine-config patch formats"
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
# A reference bundle producer for tests, sealing for a test trust.
testkit = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
tar.workspace = true
flate2.workspace = true
# Offline only; aws-lc-rs is sigstore-crypto's only provider.
sigstore-verify = { version = "=0.15.0", default-features = false, features = ["aws-lc-rs"] }
sigstore-trust-root = { version = "=0.15.0", default-features = false, features = ["aws-lc-rs"] }
sigstore-types = { version = "=0.15.0", default-features = false }
sha2 = "0.10"
hex = "0.4"
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
edge-registry = { path = "../edge-registry" }
tempfile = "3"
