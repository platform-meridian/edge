[package]
name = "edge-bundle"
version.workspace = true
description = "Meridian Edge: the update bundle and machine-config patch formats"
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
# A reference bundle producer for tests, sealing with ssh-keygen.
testkit = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tar.workspace = true
flate2.workspace = true
ssh-key = { version = "0.6", features = ["ed25519", "std"] }
sha2 = "0.10"
hex = "0.4"
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
edge-registry = { path = "../edge-registry" }
tempfile = "3"
