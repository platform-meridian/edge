[package]
name = "edge-bundle"
version.workspace = true
description = "Meridian Edge: the update bundle and machine-config patch formats, for the unit that reads them and the tools that write them"
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Bundles sealed with ssh-keygen, as a build shell does: a reference producer for tests.
testkit = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tar.workspace = true
ssh-key = { version = "0.6", features = ["ed25519", "std"] }
sha2 = "0.10"
hex = "0.4"
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile = "3"
