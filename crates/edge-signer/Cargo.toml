[package]
name = "edge-signer"
version.workspace = true
description = "Meridian Edge: pod certificate signer and operator access"
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
edge-common = { path = "../edge-common" }
edge-kube = { path = "../edge-kube" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "time"] }
futures.workspace = true
rustls.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
rustls-pki-types = { version = "1", features = ["std"] }
nix = { workspace = true, features = ["net"] }
time = "0.3"
x509-parser = "0.18"
tonic = { workspace = true, features = ["tls-aws-lc"] }
tonic-prost.workspace = true
prost.workspace = true
prost-types = "0.14"
connectrpc = { version = "0.9", default-features = false, features = ["server"] }
buffa = { version = "0.9", features = ["json"] }
base64 = "0.22"
serde-saphyr.workspace = true
http.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true
connectrpc-build = "0.9"

[dev-dependencies]
tracing-subscriber.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
