// The corner of Talos's machine API (siderolabs/talos api/machine/machine.proto)
// that edge-scope uses: Events. Names and field numbers are upstream's; fields
// left out are skipped by the decoder. Any is google.protobuf.Any's wire form.
syntax = "proto3";

package machine;

service MachineService {
    rpc Events(EventsRequest) returns (stream Event);
}

message EventsRequest {
    // Negative: every event machined still holds, then new ones.
    int32 tail_events = 1;
}

message Any {
    string type_url = 1;
    bytes value = 2;
}

message Event {
    Any data = 2;
    string id = 3;
}

message SequenceEvent {
    string sequence = 1;
    enum Action {
        NOOP = 0;
        START = 1;
        STOP = 2;
    }
    Action action = 2;
}

message ServiceStateEvent {
    string service = 1;
    enum Action {
        INITIALIZED = 0;
        PREPARING = 1;
        WAITING = 2;
        RUNNING = 3;
        STOPPING = 4;
        FINISHED = 5;
        FAILED = 6;
        SKIPPED = 7;
        STARTING = 8;
    }
    Action action = 2;
    string message = 3;
    ServiceHealth health = 4;
}

message ServiceHealth {
    bool unknown = 1;
    bool healthy = 2;
}
