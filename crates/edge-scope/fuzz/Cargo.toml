[package]
name = "edge-scope-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[[bin]]
name = "log_line"
path = "fuzz_targets/log_line.rs"
test = false
doc = false
bench = false
