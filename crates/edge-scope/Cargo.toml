[package]
name = "edge-scope"
version.workspace = true
description = "Meridian Edge: power-cut-safe flight recorder for pressure and resets"
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
edge-common = { path = "../edge-common" }
crc32fast.workspace = true
serde = { workspace = true }
serde_json.workspace = true
nix = { workspace = true, features = ["fs", "time", "ioctl", "socket"] }
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time"] }
tonic = { workspace = true, features = ["router"] }
tonic-prost.workspace = true
prost.workspace = true
tower = "0.5"
hyper-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tempfile = "3"

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true
